<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход в {{ service_name }}</title>
</head>
<body>
    <main>
        <h1>Выполняется вход в {{ service_name }}</h1>
        <p>Сервис получит одноразовый код. Постоянный токен Quick Access в браузер не передаётся.</p>
        <p>Код действует не более {{ expires_in }} секунд и может быть использован один раз.</p>
        <form id="quick-access-handoff" method="post" action="{{ callback_url }}" autocomplete="off">
            <input type="hidden" name="code" value="{{ code }}">
            <input type="hidden" name="state" value="{{ state }}">
            <button type="submit">Продолжить</button>
        </form>
        <noscript><p>Автоматический переход недоступен. Нажмите «Продолжить».</p></noscript>
    </main>
    <script nonce="{{ csp_nonce }}">document.getElementById('quick-access-handoff').submit();</script>
</body>
</html>
